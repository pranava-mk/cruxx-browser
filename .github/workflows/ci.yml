name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm python python-gobject gtk3 webkit2gtk-4.1
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: python -m unittest -v tests.test_omnibox tests.test_store tests.test_shield tests.test_security tests.test_theme
